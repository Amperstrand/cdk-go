[package]
name = "cdk-ffi-go"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.18.2"
readme = "README.md"

[lib]
crate-type = ["cdylib"]
name = "cdk_ffi_go"

[dependencies]
cdk-ffi = { version = "=0.18.2", features = ["npubcash", "nwc", "bip353"] }

[lints]


[profile.release]
lto = true
strip = true
codegen-units = 1
